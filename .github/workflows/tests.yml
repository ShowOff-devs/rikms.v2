name: tests

on:
  push:
    branches:
      - develop
      - main
      - master
      - workos
      - 'release/**'
  pull_request:
    branches:
      - develop
      - main
      - master
      - workos
      - 'release/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm run test:frontend

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci

      - name: Audit PHP dependencies
        run: composer audit --locked

      - name: Audit production npm dependencies
        run: npm audit --omit=dev

      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Backend tests
        run: php artisan test

      - name: Type check
        run: npm run types:check

      - name: Production build
        run: npm run build

  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.4', '8.5']

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
          coverage: xdebug

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Node Dependencies
        run: npm ci

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Build Assets
        run: npm run build

      - name: Tests
        run: ./vendor/bin/pest

  coverage-baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP with coverage
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: xdebug

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --optimize-autoloader

      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Generate coverage baseline
        run: ./vendor/bin/pest --coverage --coverage-clover=coverage.xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: php-coverage-baseline
          path: coverage.xml
          if-no-files-found: error
          retention-days: 14

  mysql-integration:
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: rikms_test
      DB_USERNAME: rikms_test
      DB_PASSWORD: rikms_test_password
      MONGODB_URI: ''
      MONGODB_DATABASE: ''
      CACHE_STORE: array
      MAIL_MAILER: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      RIKMS_ALLOW_DEV_SEED_ACCOUNTS: 'false'
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: rikms_test
          MYSQL_USER: rikms_test
          MYSQL_PASSWORD: rikms_test_password
          MYSQL_ROOT_PASSWORD: rikms_test_root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=rikms_test --password=rikms_test_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql
          tools: composer:v2
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --optimize-autoloader

      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Fresh MySQL migrations and required seeders
        run: php artisan migrate:fresh --seed --force

      - name: Verify safe rollback and remigration
        run: |
          php artisan migrate:rollback --step=1 --force
          php artisan migrate --force

      - name: MySQL integration and application tests
        run: php artisan test
